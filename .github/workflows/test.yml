name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows spawns git and node more slowly; its suite runs past 10 minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
      # The page's own tests. The browser ones need Chrome and skip without it.
      - run: npm run test:ui
        env:
          AVOOZL_CHROME: skip
      - run: npm pack --dry-run

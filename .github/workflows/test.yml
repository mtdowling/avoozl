name: Test
# Pushes run only on main; a pull request runs once, from pull_request.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows spawns git and node more slowly; its suite plus the UI's browser
    # tests run 22 to 25 minutes there, so 25 cancelled passing runs.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A change that touches only specs, docs and Markdown skips the suite,
      # but the job still runs so its required check reports. The skip is
      # not done with paths-ignore: a skipped workflow leaves required checks
      # pending. Anything the diff cannot read runs the full suite.
      - name: Changed files
        id: changes
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          docs=false
          if files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null) && [ -n "$files" ]; then
            # Portable role prompts are runtime inputs, even though they are Markdown.
            if ! printf '%s\n' "$files" | grep -Ev '^(\.kiro/specs/|docs/)|\.md$' >/dev/null &&
               ! printf '%s\n' "$files" | grep '^prompts/' >/dev/null; then
              docs=true
            fi
          fi
          echo "docs-only=$docs" >> "$GITHUB_OUTPUT"
          echo "Docs only: $docs"
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.docs-only != 'true' || matrix.os == 'ubuntu-latest'
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.changes.outputs.docs-only != 'true' || matrix.os == 'ubuntu-latest'
      - run: npm run format:check
        if: steps.changes.outputs.docs-only != 'true' || matrix.os == 'ubuntu-latest'
      # Spec lint runs on every change, so a bad spec still fails.
      - run: node scripts/spec-lint.mjs
        if: matrix.os == 'ubuntu-latest'
      # The build receipt: one JSON line for this run (RC32.4).
      - run: node bin/build-receipt --target ${{ matrix.os }} -- npm test
        if: steps.changes.outputs.docs-only != 'true'
        env:
          AVOOZL_RECEIPT_FILE: build-receipt.jsonl
      - name: Receipt to the job summary
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('build-receipt.jsonl') != ''
        run: |
          echo '### Build receipt' >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 build-receipt.jsonl >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('build-receipt.jsonl') != ''
        with:
          name: build-receipt
          path: build-receipt.jsonl
          retention-days: 30
      # The page's own tests. The browser ones need Chrome and skip without it.
      - run: npm run test:ui
        if: steps.changes.outputs.docs-only != 'true'
        env:
          AVOOZL_CHROME: skip
      - run: npm pack --dry-run
        if: steps.changes.outputs.docs-only != 'true'

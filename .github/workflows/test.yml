name: Test
# Pushes run only on main; a pull request runs once, from pull_request.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows spawns git and node more slowly; its suite takes about 5
    # minutes there with temp on the work drive, against 2 to 4 elsewhere.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The tests make thousands of temporary folders, git repositories and
      # SQLite files. The runner's C: drive is slow; its D: work drive cut the
      # Windows suite from about 11 minutes to about 4.
      - name: Temp on the work drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # A change that touches only specs, docs and Markdown skips the suite,
      # but the job still runs so its required check reports. The skip is
      # not done with paths-ignore: a skipped workflow leaves required checks
      # pending. Anything the diff cannot read runs the full suite.
      - name: Changed files
        id: changes
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          docs=false
          if files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null) && [ -n "$files" ]; then
            # Portable role prompts are runtime inputs, even though they are Markdown.
            if ! printf '%s\n' "$files" | grep -Ev '^(\.kiro/specs/|docs/)|\.md$' >/dev/null &&
               ! printf '%s\n' "$files" | grep '^prompts/' >/dev/null; then
              docs=true
            fi
          fi
          echo "docs-only=$docs" >> "$GITHUB_OUTPUT"
          echo "Docs only: $docs"
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.docs-only != 'true' || matrix.os == 'ubuntu-latest'
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.changes.outputs.docs-only != 'true' || matrix.os == 'ubuntu-latest'
      # Formatting does not depend on the platform, so one runner checks it.
      - run: npm run format:check
        if: matrix.os == 'ubuntu-latest'
      # Spec lint runs on every change, so a bad spec still fails.
      - run: node scripts/spec-lint.mjs
        if: matrix.os == 'ubuntu-latest'
      # The build receipt: one JSON line for this run (RC32.4).
      - run: node bin/build-receipt --target ${{ matrix.os }} -- npm test
        if: steps.changes.outputs.docs-only != 'true'
        env:
          AVOOZL_RECEIPT_FILE: build-receipt.jsonl
      # Every platform keeps its receipt, and the summary prints every line (R101.3).
      - name: Receipt to the job summary
        if: always() && hashFiles('build-receipt.jsonl') != ''
        shell: bash
        run: |
          echo '### Build receipt (${{ matrix.os }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build-receipt.jsonl >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('build-receipt.jsonl') != ''
        with:
          name: build-receipt-${{ matrix.os }}
          path: build-receipt.jsonl
          retention-days: 30
      # The page's own tests. The browser ones need Chrome and skip without it.
      - run: npm run test:ui
        if: steps.changes.outputs.docs-only != 'true'
        env:
          AVOOZL_CHROME: skip
      - run: npm pack --dry-run
        if: steps.changes.outputs.docs-only != 'true'
